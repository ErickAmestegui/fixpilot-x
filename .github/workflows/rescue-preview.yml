name: Publish free Rescue preview
on:
  push:
    branches: [rescue-intelligence, rescue-challenge]
    paths: ['src/**', 'server/**', 'public/**', 'index.html', 'package*.json', 'vite*.ts', '.github/workflows/rescue-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rescue-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.ref_name == 'rescue-challenge'
        run: npx playwright install --with-deps chromium
      - if: github.ref_name == 'rescue-challenge'
        name: Verify browser regressions and genuine MCP Apps
        run: |
          npm run dev -- --strictPort > /tmp/fixpilot-vite.log 2>&1 &
          node --input-type=module -e "for(let i=0;i<40;i++){try{if((await fetch('http://127.0.0.1:5173')).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)"
          npm run test:e2e
          npm run test:challenge:matrix
      - if: github.ref_name == 'rescue-challenge'
        name: Package stable root plus separate Challenge path
        run: node scripts/package-challenge-preview.mjs
      - if: github.ref_name == 'rescue-challenge'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-release
      - if: github.ref_name != 'rescue-challenge'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
